[platformio]
default_envs = m5stack_stamp_s3
src_dir = .
; ASCII-only path avoids a linker map-file issue caused by the Japanese
; characters in the OneDrive project path.
build_dir = C:/tmp/RejsaRubberTrac-build

[env:m5stack_stamp_s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; This project is an Arduino sketch kept at the project root.
upload_port = COM32
monitor_port = COM32
monitor_speed = 115200

board_build.mcu = esp32s3
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv

lib_deps =
    m5stack/M5Unified
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
    adafruit/Adafruit MAX1704X
    https://github.com/m5stack/M5PM1.git
    https://github.com/sparkfun/SparkFun_BMI270_Arduino_Library.git

; Tasker and the Adafruit libraries are already installed in the Arduino
; library folder used by the original sketch.
build_flags =
    -Os
    -DCORE_DEBUG_LEVEL=0
    -IC:/Users/morly/OneDrive/doc/Arduino/libraries/Tasker

; Keep generated PlatformIO files out of the sketch source scan.
build_src_filter = +<*.ino> +<*.cpp> +<*.h>
